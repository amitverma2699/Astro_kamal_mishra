<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#720e17" />
      <stop offset="100%" stop-color="#3e0004" />
    </radialGradient>
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="25%" stop-color="#FFD54F" />
      <stop offset="50%" stop-color="#FFA000" />
      <stop offset="75%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Border -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
  <!-- Inner thin gold border -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7" />

  <g transform="translate(256, 256) scale(0.75) translate(-256, -256)">
    <!-- Swastika Symbol -->
    <path d="M 256,100 L 256,412
             M 100,256 L 412,256
             M 256,100 L 380,100
             M 256,412 L 132,412
             M 100,256 L 100,132
             M 412,256 L 412,380" 
          fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Traditional Four Dots inside Swastika quadrants -->
    <circle cx="178" cy="178" r="12" fill="url(#goldGrad)" />
    <circle cx="334" cy="178" r="12" fill="url(#goldGrad)" />
    <circle cx="178" cy="334" r="12" fill="url(#goldGrad)" />
    <circle cx="334" cy="334" r="12" fill="url(#goldGrad)" />
  </g>
</svg>

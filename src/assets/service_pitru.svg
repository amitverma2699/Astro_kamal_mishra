<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#720e17" />
      <stop offset="100%" stop-color="#3e0004" />
    </radialGradient>
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="25%" stop-color="#FFD54F" />
      <stop offset="50%" stop-color="#FFA000" />
      <stop offset="75%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Border -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
  <!-- Inner thin gold border -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7" />

  <!-- Peepal Leaf Path -->
  <g transform="translate(256, 256) scale(0.8) translate(-256, -256)">
    <!-- Elegant Peepal Leaf -->
    <path d="M 256,70 C 170,70 100,120 100,220 C 100,320 220,380 256,450 C 292,380 412,320 412,220 C 412,120 342,70 256,70 Z" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />
    <!-- Leaf veins -->
    <path d="M 256,70 L 256,430" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <!-- Side veins -->
    <path d="M 256,150 C 210,180 160,190 140,195" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 256,150 C 302,180 352,190 376,195" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    
    <path d="M 256,220 C 190,250 140,260 120,265" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 256,220 C 322,250 372,260 392,265" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

    <path d="M 256,290 C 200,320 160,335 140,340" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 256,290 C 312,320 352,335 372,340" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

    <path d="M 256,360 C 220,385 190,395 180,400" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 256,360 C 292,385 322,395 332,400" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
